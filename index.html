<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destination Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <h1>Travel Destination Showcase</h1>
        <h3>For India</h3>
        <p>Explore breathtaking destinations, seasonal highlights, and budget comparisons.</p>
    </header>

    <main class="container">
    <!-- CSS Radio Inputs for Season Filtering -->
    <input type="radio" name="season-filter" id="filter-all" checked>
    <input type="radio" name="season-filter" id="filter-spring">
    <input type="radio" name="season-filter" id="filter-summer">
    <input type="radio" name="season-filter" id="filter-autumn">
    <input type="radio" name="season-filter" id="filter-winter">
    <input type="radio" name="season-filter" id="filter-monsoon">

    <!-- Filter Navigation Buttons -->
    <div class="filter-controls" role="group" aria-label="Filter destinations by season">
      <label for="filter-all" class="filter-btn">All Seasons</label>
      <label for="filter-spring" class="filter-btn">Spring</label>
      <label for="filter-summer" class="filter-btn">Summer</label>
      <label for="filter-autumn" class="filter-btn">Autumn</label>
      <label for="filter-winter" class="filter-btn">Winter</label>
      <label for="filter-monsoon" class="filter-btn">Monsoon</label>
    </div>

    


<!-- COMPARISON TABLE & FOOTER  -->
    <section class="comparison-section" aria-labelledby="table-heading">
      <h2 id="table-heading">Destination Comparison Guide</h2>
      <p class="section-subtitle">ideal travel seasons, and visitor ratings at a glance.</p>
    <div class="table-responsive">
        <table class="comparison-table">
          <thead>
            <tr>
              <th>Destination</th>
              <th>Best Season</th>
              <th>Top Highlight</th>
              <th>Visitor Rating</th>
            </tr>
          </thead>
          <tbody>
</body>

</html>
